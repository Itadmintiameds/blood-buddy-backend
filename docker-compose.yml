services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: blood-buddy-backend:latest
    container_name: blood-buddy-backend
    ports:
      - "8080:8080"
    # Loads SUPERADMIN_EMAIL, SUPERADMIN_PASSWORD, APP_CORS_ALLOWED_ORIGINS, AWS_* etc.
    env_file:
      - .env
    environment:
      # Pin the active profile; override at runtime if needed.
      SPRING_PROFILES_ACTIVE: dev
    # Postgres runs on the host, so the app reaches it via host.docker.internal.
    # This mapping is a no-op on Docker Desktop (Win/Mac) but required on native Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
