server:
  servlet:
    context-path: /api/v1

app:
  login-url: https://pharma-aggregator-test.tiameds.ai/reset-password
  frontend-url: https://pharma-aggregator-test.tiameds.ai
  admin-frontend-url: https://tiameds-admin-dashboard.vercel.app
  reset-token-expiration-hours: 1
  jwt:
    secret: mySecretKeyForJWTTokenGenerationAndValidation2024!@#$%^&*
    expiration: 86400000        # 30 minutes (access token) // Temporarily set to 24 hours for testing, change back to 30 minutes in production
    refresh-expiration: 604800000  # 7 days (refresh token)

spring:
  main:
    allow-bean-definition-overriding: true

  datasource:

    url: jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}?characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail: # Email configuration
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  # Twilio sms
twilio:
  account-sid: ${ACCOUNT_SID}
  auth-token: ${AUTH_TOKEN}
  verify:
    service-sid: ${SERVICE_SID}

springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    region: ${AWS_REGION}
    bucket-name: ${AWS_BUCKET_NAME}