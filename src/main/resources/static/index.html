<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blood Centre Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #222;
        }

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            border-bottom: 1px solid #ddd;
        }

        .back {
            font-size: 32px;
            margin-right: 12px;
            cursor: pointer;
        }

        .title {
            font-size: 18px;
            font-weight: 500;
        }

        .container {
            padding: 15px 10px 90px;
            max-width: 600px;
            margin: auto;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .input-group input {
            width: 100%;
            height: 47px;
            padding: 0 45px;

            border: 1px solid #ccc;
            border-radius: 7px;

            outline: none;
            font-size: 14px;
        }

        .input-group input:focus {
            border-color: #ff383d;
        }

        .icon {
            position: absolute;
            left: 17px;
            top: 50%;
            transform: translateY(-50%);

            color: #ff383d;
            font-size: 18px;
        }

        .password-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);

            color: #ff383d;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .error {
            color: #ff3338;
        }

        .success {
            color: green;
        }

        button {
            border: none;
            border-radius: 7px;

            background: #ff383d;
            color: white;

            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .send-btn {
            position: fixed;

            left: 5px;
            right: 5px;
            bottom: 18px;

            height: 45px;
        }

        /* =========================
           OTP SECTION
           ========================= */

        #otpSection {
            display: none;

            text-align: center;

            padding-top: 30px;
        }

        .otp-icon {
            width: 76px;
            height: 76px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fff0f0;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.12);
        }

        .otp-icon span {
            font-size: 40px;
        }

        .otp-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 18px;
        }

        .description {
            color: #999;
            font-size: 13px;
            line-height: 20px;
            margin-bottom: 20px;
        }

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 9px;
        }

        .otp-input {
            width: 42px;
            height: 43px;

            border: 1px solid #ccc;
            border-radius: 7px;

            text-align: center;

            font-size: 20px;

            outline: none;
        }

        .otp-input:focus {
            border: 2px solid #ff383d;
        }

        .resend-text {
            margin-top: 18px;
            font-size: 14px;
            color: #555;
        }

        .resend-btn {
            background: none;
            color: #ff383d;

            margin-top: 5px;
        }

        .verify-btn {
            width: 100%;
            height: 45px;

            margin-top: 30px;
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<div class="header">

    <div class="back"
         onclick="history.back()">

        ‹

    </div>

    <div class="title">

        Blood Centre Registration

    </div>

</div>



<div class="container">


    <!-- =========================
         REGISTRATION SECTION
         ========================= -->

    <div id="registrationSection">


        <!-- Blood Centre Name -->

        <div class="input-group">

            <span class="icon">♨</span>

            <input
                    type="text"
                    id="bloodCentreName"
                    placeholder="Blood Centre Name">

        </div>


        <!-- License Number -->

        <div class="input-group">

            <span class="icon">♧</span>

            <input
                    type="text"
                    id="licenseNumber"
                    placeholder="Blood Centre License Number">

        </div>


        <!-- Mobile -->

        <div class="input-group">

            <span class="icon">☎</span>

            <input
                    type="text"
                    id="mobileNumber"
                    placeholder="Mobile Number"
                    maxlength="10"
                    inputmode="numeric">

        </div>


        <!-- Email -->

        <div class="input-group">

            <span class="icon">✉</span>

            <input
                    type="email"
                    id="email"
                    placeholder="Email Address">

        </div>


        <!-- Password -->

        <div class="input-group">

            <span class="icon">♙</span>

            <input
                    type="password"
                    id="password"
                    placeholder="Password">

            <span
                    class="password-icon"
                    onclick="togglePassword(
                        'password',
                        this
                    )">

                ◉

            </span>

        </div>


        <!-- Confirm Password -->

        <div class="input-group">

            <span class="icon">♙</span>

            <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password">

            <span
                    class="password-icon"
                    onclick="togglePassword(
                        'confirmPassword',
                        this
                    )">

                ◉

            </span>

        </div>


        <!-- Address -->

        <div class="input-group">

            <span class="icon">⌖</span>

            <input
                    type="text"
                    id="address"
                    placeholder="Address">

        </div>


        <!-- Pin Code -->

        <div class="input-group">

            <span class="icon">▦</span>

            <input
                    type="text"
                    id="pincode"
                    placeholder="Pin Code"
                    maxlength="6"
                    inputmode="numeric">

        </div>


    </div>



    <!-- =========================
         OTP SECTION
         ========================= -->

    <div id="otpSection">


        <div class="otp-icon">

            <span>💬</span>

        </div>


        <h2>
            Verify your mobile number
        </h2>


        <div class="description">

            We just sent you a verification code
            <br>

            to your mobile number

        </div>


        <div class="otp-title">

            Enter your OTP code here

        </div>


        <!-- OTP BOXES -->

        <div class="otp-container">

            <input
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric">

            <input
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric">

            <input
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric">

            <input
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric">

            <input
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric">

            <input
                    class="otp-input"
                    maxlength="1"
                    inputmode="numeric">

        </div>


        <div class="resend-text">

            Didn't receive the OTP?

        </div>


        <button
                type="button"
                class="resend-btn"
                id="resendBtn"
                onclick="resendOtp()">

            Resend OTP

        </button>


        <button
                type="button"
                class="verify-btn"
                id="verifyBtn"
                onclick="verifyOtp()">

            Verify OTP

        </button>


    </div>



    <div id="message"></div>


</div>



<!-- SEND OTP -->

<button
        type="button"
        class="send-btn"
        id="sendOtpBtn"
        onclick="sendOtp()">

    Send OTP

</button>



<script>


    /* =====================================
       VARIABLES
       ===================================== */

    const otpInputs =
        document.querySelectorAll(
            ".otp-input"
        );



    /* =====================================
       PASSWORD
       ===================================== */

    function togglePassword(
        fieldId,
        icon
    ) {

        const input =
            document.getElementById(
                fieldId
            );

        if (input.type === "password") {

            input.type = "text";

        } else {

            input.type = "password";

        }

    }



    /* =====================================
       MESSAGE
       ===================================== */

    function showError(message) {

        const element =
            document.getElementById(
                "message"
            );

        element.innerText =
            message;

        element.className =
            "error";

    }


    function showSuccess(message) {

        const element =
            document.getElementById(
                "message"
            );

        element.innerText =
            message;

        element.className =
            "success";

    }



    /* =====================================
       SEND OTP
       ===================================== */

    async function sendOtp() {


        const bloodCentreName =
            document.getElementById(
                "bloodCentreName"
            ).value.trim();


        const licenseNumber =
            document.getElementById(
                "licenseNumber"
            ).value.trim();


        const mobileNumber =
            document.getElementById(
                "mobileNumber"
            ).value.trim();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const address =
            document.getElementById(
                "address"
            ).value.trim();


        const pincode =
            document.getElementById(
                "pincode"
            ).value.trim();



        /* VALIDATION */

        if (!bloodCentreName) {
            showError("Blood centre name is required");
            return;
        }

        if (!licenseNumber) {
            showError("License number is required");
            return;
        }

        if (!/^[6-9][0-9]{9}$/.test(
            mobileNumber
        )) {

            showError(
                "Enter a valid 10-digit mobile number"
            );

            return;
        }

        if (!email) {
            showError("Email is required");
            return;
        }

        if (!password) {
            showError("Password is required");
            return;
        }

        if (password !== confirmPassword) {

            showError(
                "Passwords do not match"
            );

            return;
        }

        if (!address) {
            showError("Address is required");
            return;
        }

        if (!/^[0-9]{6}$/.test(
            pincode
        )) {

            showError(
                "Pin code must be 6 digits"
            );

            return;
        }



        const button =
            document.getElementById(
                "sendOtpBtn"
            );


        button.disabled = true;

        button.innerText =
            "Sending OTP...";


        try {


            /* =========================
               SEND OTP API
               ========================= */

            const response =
                await fetch(
                    "http://localhost:8080/api/v1/"
                    + "?mobileNumber="
                    + encodeURIComponent(
                        mobileNumber
                    ),
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            console.log(
                "Send OTP:",
                data
            );


            if (!response.ok) {

                showError(
                    data.message ||
                    "Failed to send OTP"
                );

                button.disabled = false;

                button.innerText =
                    "Send OTP";

                return;
            }



            /* =========================
               SAVE REGISTRATION DATA
               ========================= */

            const registrationData = {

                bloodCentreName,
                licenseNumber,
                mobileNumber,
                email,
                password,
                confirmPassword,
                address,
                pincode

            };


            sessionStorage.setItem(
                "registrationData",
                JSON.stringify(
                    registrationData
                )
            );


            sessionStorage.setItem(
                "mobileNumber",
                mobileNumber
            );



            /* =========================
               HIDE REGISTER
               SHOW OTP
               ========================= */

            document.getElementById(
                "registrationSection"
            ).style.display = "none";


            document.getElementById(
                "otpSection"
            ).style.display = "block";


            button.style.display = "none";


            showSuccess(
                "OTP sent successfully"
            );


            otpInputs[0].focus();

        }
        catch (error) {

            console.error(error);

            showError(
                "Unable to connect to server"
            );

            button.disabled = false;

            button.innerText =
                "Send OTP";

        }

    }



    /* =====================================
       OTP INPUT
       ===================================== */

    otpInputs.forEach(
        function(input, index) {

            input.addEventListener(
                "input",
                function() {

                    this.value =
                        this.value.replace(
                            /[^0-9]/g,
                            ""
                        );


                    if (
                        this.value &&
                        index <
                        otpInputs.length - 1
                    ) {

                        otpInputs[
                            index + 1
                        ].focus();

                    }

                }
            );


            input.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Backspace" &&
                        !this.value &&
                        index > 0
                    ) {

                        otpInputs[
                            index - 1
                        ].focus();

                    }

                }
            );

        }
    );



    /* =====================================
       VERIFY OTP
       ===================================== */

    async function verifyOtp() {


        const mobileNumber =
            sessionStorage.getItem(
                "mobileNumber"
            );


        const button =
            document.getElementById(
                "verifyBtn"
            );


        let otp = "";


        otpInputs.forEach(
            function(input) {

                otp += input.value;

            }
        );


        if (otp.length !== 6) {

            showError(
                "Please enter the 6-digit OTP"
            );

            return;
        }


        button.disabled = true;

        button.innerText =
            "Verifying...";


        try {


            /* =========================
               VERIFY API
               ========================= */

            const response =
                await fetch(
                    "http://localhost:8080/api/v1/otp/verify"
                    + "?mobileNumber="
                    + encodeURIComponent(
                        mobileNumber
                    )
                    + "&otp="
                    + encodeURIComponent(
                        otp
                    ),
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            console.log(
                "Verify OTP:",
                data
            );


            if (!response.ok) {

                showError(
                    data.message ||
                    "Invalid or expired OTP"
                );


                clearOtp();


                button.disabled = false;

                button.innerText =
                    "Verify OTP";

                otpInputs[0].focus();

                return;
            }


            showSuccess(
                "Mobile number verified successfully"
            );


            /* =========================
               REGISTER
               ========================= */

            await registerBloodCentre();

        }
        catch (error) {

            console.error(error);

            showError(
                "Unable to connect to server"
            );

            button.disabled = false;

            button.innerText =
                "Verify OTP";

        }

    }



    /* =====================================
       REGISTER BLOOD CENTRE
       ===================================== */

    async function registerBloodCentre() {


        const savedData =
            sessionStorage.getItem(
                "registrationData"
            );


        if (!savedData) {

            showError(
                "Registration data not found"
            );

            return;
        }


        const requestData =
            JSON.parse(
                savedData
            );


        try {


            const response =
                await fetch(
                    "http://localhost:8080/api/v1/blood-centres/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                requestData
                            )
                    }
                );


            const data =
                await response.json();


            console.log(
                "Register:",
                data
            );


            if (!response.ok) {

                showError(
                    data.message ||
                    "Registration failed"
                );

                return;
            }


            showSuccess(
                "Registration successful!"
            );


            sessionStorage.removeItem(
                "registrationData"
            );

            sessionStorage.removeItem(
                "mobileNumber"
            );


            document.getElementById(
                "otpSection"
            ).style.display = "none";


        }
        catch (error) {

            console.error(error);

            showError(
                "Unable to connect to server"
            );

        }

    }



    /* =====================================
       RESEND OTP
       ===================================== */

    async function resendOtp() {


        const mobileNumber =
            sessionStorage.getItem(
                "mobileNumber"
            );


        const button =
            document.getElementById(
                "resendBtn"
            );


        button.disabled = true;

        button.innerText =
            "Sending...";


        try {


            const response =
                await fetch(
                    "http://localhost:8080/api/v1/otp/send"
                    + "?mobileNumber="
                    + encodeURIComponent(
                        mobileNumber
                    ),
                    {
                        method: "POST"
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                showError(
                    data.message ||
                    "Failed to resend OTP"
                );

                button.disabled = false;

                button.innerText =
                    "Resend OTP";

                return;
            }


            showSuccess(
                "OTP sent successfully"
            );


            clearOtp();

            otpInputs[0].focus();


            let seconds = 30;


            button.innerText =
                "Resend in " +
                seconds +
                "s";


            const timer =
                setInterval(
                    function() {

                        seconds--;


                        button.innerText =
                            "Resend in " +
                            seconds +
                            "s";


                        if (seconds <= 0) {

                            clearInterval(timer);

                            button.disabled =
                                false;

                            button.innerText =
                                "Resend OTP";

                        }

                    },
                    1000
                );

        }
        catch (error) {

            console.error(error);

            showError(
                "Unable to connect to server"
            );

            button.disabled = false;

            button.innerText =
                "Resend OTP";

        }

    }



    /* =====================================
       CLEAR OTP
       ===================================== */

    function clearOtp() {

        otpInputs.forEach(
            function(input) {

                input.value = "";

            }
        );

    }

</script>


</body>

</html>
