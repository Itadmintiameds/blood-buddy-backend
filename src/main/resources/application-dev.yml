jwt:
  secret-key: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000

spring:
  datasource:
    url: jdbc:postgresql://${DB_URL:localhost}:5432/${DB_NAME:blood_buddy}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  cookie:
    domain:
  cors:
    # Comma-separated allowed origins; "*" allows any origin.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}

#     AWS S3 Configuration

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY:dummy}
    secret-key: ${AWS_SECRET_KEY:dummy}
    region: ${AWS_REGION:ap-south-1}
    bucket-name: ${AWS_BUCKET_NAME:dummy}

superadmin:
  email: ${SUPERADMIN_EMAIL}
  password: ${SUPERADMIN_PASSWORD}