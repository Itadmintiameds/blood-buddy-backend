server:
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always
    include-exception: true
    include-stacktrace: always
  tomcat:
    max-part-count: 50

spring:

  main:
    allow-bean-definition-overriding: true

  datasource:
    url: jdbc:postgresql://localhost:5432/bloodbuddy-application?charSet=UTF8
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB


